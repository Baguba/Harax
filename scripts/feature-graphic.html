<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #edf1e4;
    font-family: "Nunito", sans-serif;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* lemon field backdrop with ink frame */
  .field {
    position: absolute;
    inset: 18px;
    background: #a3e635;
    border: 4px solid #0c110b;
    border-radius: 36px;
    box-shadow: 0 8px 0 0 #4d7c0f;
    overflow: hidden;
  }
  /* soft cream blobs for texture (flat, no gradients) */
  .blob { position: absolute; background: #d9f99d; border-radius: 50%; }
  .b1 { width: 300px; height: 300px; top: -120px; left: -100px; }
  .b2 { width: 220px; height: 220px; bottom: -90px; right: 140px; }
  .b3 { width: 120px; height: 120px; top: 60px; right: -40px; }

  .inner {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 46px;
    padding: 0 64px;
  }
  .mark {
    width: 190px; height: 190px;
    background: #fbfdf8;
    border: 5px solid #0c110b;
    border-radius: 54px;
    box-shadow: 0 10px 0 0 #4d7c0f;
    display: grid; place-items: center;
    transform: rotate(-4deg);
    flex-shrink: 0;
  }
  .mark svg { width: 120px; height: 120px; }
  .text { color: #0c110b; }
  h1 {
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 118px;
    line-height: 0.95;
    letter-spacing: -0.02em;
  }
  h1 .leaf { color: #4d7c0f; }
  .tag {
    display: inline-block;
    margin-top: 18px;
    background: #0c110b;
    color: #d9f99d;
    font-weight: 800;
    font-size: 27px;
    padding: 10px 26px;
    border-radius: 999px;
    transform: rotate(-1.5deg);
  }
  .sub {
    margin-top: 16px;
    font-size: 21px;
    font-weight: 800;
    color: #1c2b12;
  }
</style>
</head>
<body>
  <div class="field">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>
  <div class="inner">
    <div class="mark">
      <svg viewBox="0 0 64 64" fill="none">
        <g transform="rotate(-4 32 32)">
          <path d="M22 12C17.2 12 13.2 16 13.2 20.8C13.2 25.2 13 29.4 13.2 33.6C13.4 38.2 17.2 41.8 22 41.8L27.8 41.8C25.2 45.2 22.4 48.3 20.2 50.6C23.6 49 27.2 45.4 30.6 42C34.9 42 39.7 41.9 44 41.6C48.8 41.4 52.4 37.8 52.4 33C52.5 29 52.6 24.6 52.4 20.6C52.3 16 48.6 12.2 43.8 12.2C36 12.1 28.5 12 22 12Z" fill="#a3e635" stroke="#0c110b" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M28.6 19.4L28.6 35M28.6 25.6C29.8 23.4 31.8 22.6 33.7 23.1C35.9 23.7 37 25.8 36.9 28.3L36.9 35" stroke="#0c110b" stroke-width="3.4" stroke-linecap="round"/>
        </g>
        <g transform="translate(44.2 1.8) rotate(32)">
          <path d="M1.4 9.4C0.4 4.5 3.3 0.8 8.4 0.6C9.6 5.5 6.9 9.6 1.9 10C1.7 10 1.5 9.7 1.4 9.4Z" fill="#4d7c0f" stroke="#0c110b" stroke-width="2" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
    <div class="text">
      <h1>Harax<span class="leaf">.</span></h1>
      <div class="tag">Your campus, connected.</div>
      <div class="sub">Haramaya University · posts · events · games</div>
    </div>
  </div>
</body>
</html>
